version: "3.8"
networks:
  appnet:
    driver: overlay

volumes:
  mongo-data:
  redis-data:
  front-npm:
  back-npm:

services:
  mongo:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db
    networks: [appnet]

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks: [appnet]

  backend:
    build: ./backend
    volumes:
      - back-npm:/app/node_modules
    env_file: ./backend/.env
    networks: [appnet]
    deploy:
      replicas: 2

  frontend:
    build: ./frontend
    volumes:
      - front-npm:/app/node_modules
    env_file: ./frontend/.env.local
    networks: [appnet]
    deploy:
      replicas: 2

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    ports:
      - "80:80"
    networks: [appnet]
    deploy:
      placement:
        constraints:
          - node.role == manager
