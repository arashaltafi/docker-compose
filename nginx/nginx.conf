worker_processes auto;
events { worker_connections 1024 }

http {
  resolver 127.0.0.11 valid=30s ipv6=off;  # Docker internal DNS :contentReference[oaicite:1]{index=1}

  include /etc/nginx/proxy_params;

  server {
    listen 80;
    server_name front.example.com;

    location / {
      set $upstream "frontend:3000";
      proxy_pass http://$upstream;
    }
  }

  server {
    listen 80;
    server_name back.example.com;

    location / {
      set $upstream "backend:4000";
      proxy_pass http://$upstream;
    }
  }
}