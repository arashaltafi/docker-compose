version: "3.9"

services:
  frontend:
    image: frontend:latest
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app_network
    deploy:
      replicas: 1

  backend:
    image: backend:latest
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    networks:
      - app_network
    deploy:
      replicas: 1

  mongo:
    image: mongo:6
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    networks:
      - app_network
    volumes:
      - mongo_data:/data/db
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - app_network
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - app_network
    deploy:
      replicas: 1

networks:
  app_network:
    driver: overlay

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local